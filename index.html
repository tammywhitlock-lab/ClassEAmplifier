<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Class E Amplifier Calculator</title>
  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 40px auto;
      line-height: 1.5;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
    }
    .box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>Class E Amplifier Calculator</h1>

<p>
Design Class E amplifiers using practical starting values.
</p>

<div class="box">
  <h2>Inputs</h2>

  <label>Supply Voltage (V)</label>
  <input id="voltage" type="number">

  <label>Output Power (W)</label>
  <input id="power" type="number">

  <label>Frequency (MHz)</label>
  <input id="freq" type="number">

  <button onclick="calculate()">Calculate</button>
</div>

<div class="box">
  <h2>Results</h2>
  <div id="results">Enter values and click calculate.</div>
</div>

<script>
function calculate() {
  const V = Number(document.getElementById("voltage").value);
  const P = Number(document.getElementById("power").value);
  const f = Number(document.getElementById("freq").value);

  if (!V || !P || !f) {
    document.getElementById("results").innerHTML = "Fill all fields.";
    return;
  }

  const R = (V * V) / P;

  document.getElementById("results").innerHTML =
    "Estimated load resistance: " + R.toFixed(2) + " ohms";
}
</script>

</body>
</html>
